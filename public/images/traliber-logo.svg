  <text x="74" y="60" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="4.5" fill="#788CF5">TRAVEL ESSENTIALS</text>
